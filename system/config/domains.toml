# system/config/domains.toml
# Vocabulaire controle des DOMAINES (D35). Source de verite unique.
#
# DEUX COUCHES a ne jamais confondre (voir docs/governance/PLAN_INCARNATION.md, brique 1) :
#   - MACHINE (retrieval, D35) : la liste des slugs `[domains.*]` est PLATE.
#     Le RAG filtre la-dessus. `domain` est MULTI-VALUE dans le frontmatter (D17) :
#     un document porte plusieurs slugs, a plat, sans principal/secondaire.
#   - HUMAINE (feuilletage Obsidian) : le champ `group` reconstruit un ARBRE lisible
#     (dossiers dans dossiers). Les `group` NE SONT PAS des domaines : aucune valeur
#     de retrieval, pure charpente pour l'oeil. La feuille de l'arbre = le slug.
#
# Regles (D35) : liste fermee mais EXTENSIBLE ; toute creation d'un nouveau domaine
# passe par un FLAG valide par user. Chaque domaine = slug canonique langue-neutre
# + aliases FR/EN (anti-doublon multilingue).

# AUTORITE D'ACCES : la liste qui fait LOI est policy.toml [domains]."knowledge" (D72, zone
# protegee D102). CE fichier = catalogue humain SUBORDONNE (labels / aliases / groupes MOC).
# Parite de slugs OBLIGATOIRE : un domaine ici doit etre declare dans policy.toml, sinon ses
# donnees sont invisibles au RAG (deni-par-defaut, invariant 4). Tout ajout = declare AUX DEUX.
version = 1

# --- Charpente de feuilletage HUMAINE (pas des domaines) -----------------------
[groups]
"finance/investing"       = "Evaluer & allouer"
"finance/trading"         = "Executer & systematiser"
"finance/assets"          = "Classes d'actifs"
"methods"                 = "Boite a outils (maths/stats du quant)"
"software"                = "Logiciel & systemes"
"thinking"                = "Penser, decider, systemes"
"_reserved"               = "Graine D35 reservee (pas encore de corpus)"

